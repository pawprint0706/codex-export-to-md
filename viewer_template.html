<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 세션 기록 뷰어</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --border:#e3e6ec; --text:#1c2430; --muted:#697180;
  --accent:#2563eb; --accent-soft:#e9f0fe; --code-bg:#f2f4f7; --hover:#f3f5f8;
}
body.dark{
  --bg:#0f141b; --panel:#151c26; --border:#26303d; --text:#d9e1ec; --muted:#8d98aa;
  --accent:#5b9bff; --accent-soft:#1b2a44; --code-bg:#0d1219; --hover:#1a2432;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 "Segoe UI",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;white-space:nowrap}
.stats{color:var(--muted);font-size:12px;white-space:nowrap}
#search{flex:1;min-width:140px;max-width:460px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none}
#search:focus{border-color:var(--accent)}
#open{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
#open:hover{filter:brightness(1.08)}
#theme{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;font-size:15px}
.layout{display:flex;height:calc(100% - 55px)}
aside{width:330px;min-width:330px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:10px 0 40px}
main{flex:1;overflow-y:auto;padding:30px 36px 100px}
.wrap{max-width:860px;margin:0 auto}
.proj{margin:2px 0}
.proj-head{display:flex;align-items:center;gap:6px;padding:7px 14px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.02em;user-select:none}
.proj-head:hover{color:var(--text)}
.ov{display:flex;align-items:center;gap:8px;margin:2px 8px 10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);cursor:pointer;text-decoration:none;color:var(--text);font-size:13.5px;font-weight:600}
.ov:hover{border-color:var(--accent)}
.ov.active{background:var(--accent-soft);border-color:var(--accent)}
.chev{font-size:10px;transition:transform .15s}
.proj.open .chev{transform:rotate(90deg)}
.cnt{margin-left:auto;background:var(--hover);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:11px}
.sess{display:block;padding:6px 14px 6px 30px;border-left:2px solid transparent;cursor:pointer;text-decoration:none;color:var(--text)}
.sess:hover{background:var(--hover)}
.sess.active{background:var(--accent-soft);border-left-color:var(--accent)}
.sess .d{color:var(--muted);font-size:11px;margin-right:6px;white-space:nowrap}
.sess .t{font-size:13px}
.crumb{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.crumb b{color:var(--accent);font-weight:600}
h1.title{font-size:24px;line-height:1.4;margin:4px 0 12px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{font-size:11.5px;color:var(--muted);background:var(--hover);border:1px solid var(--border);border-radius:20px;padding:3px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
article h1{font-size:20px}article h2{font-size:18px}article h3{font-size:16px}article h4{font-size:15px}
article h1,article h2,article h3,article h4,article h5,article h6{margin:26px 0 10px;line-height:1.4}
article h4{background:var(--hover);border:1px solid var(--border);border-radius:8px;padding:6px 12px;margin:26px 0 12px;font-size:13.5px;color:var(--muted);font-weight:600}
article p{margin:10px 0}
article a{color:var(--accent)}
article code{background:var(--code-bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
article pre{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:12px 0}
article pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.55}
article blockquote{margin:12px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--text)}
article blockquote p{margin:4px 0}
article table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px}
article th,article td{border:1px solid var(--border);padding:7px 12px;text-align:left;vertical-align:top;word-break:break-word}
article th{background:var(--hover);font-weight:600}
article img{max-width:100%;border:1px solid var(--border);border-radius:8px}
article ul,article ol{padding-left:24px;margin:10px 0}
article li{margin:3px 0}
article hr{border:none;border-top:1px solid var(--border);margin:24px 0}
article details{margin:10px 0;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
article details summary{cursor:pointer;padding:9px 14px;color:var(--muted);font-size:12.5px;user-select:none;border-radius:8px}
article details summary:hover{background:var(--hover)}
article details[open] summary{border-bottom:1px solid var(--border);border-radius:8px 8px 0 0}
article details pre{border:none;border-radius:0;margin:0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:16px;border-top:1px solid var(--border)}
.pager button{flex:1;padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;font-size:12.5px}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;margin-bottom:10px}
.landing{max-width:560px;margin:70px auto;text-align:center;color:var(--muted)}
.landing h2{color:var(--text);font-size:19px}
.landing ol{text-align:left;display:inline-block;margin:14px 0;padding-left:22px}
.landing .btn{margin-top:8px;display:inline-block;padding:10px 22px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.landing .btn:hover{filter:brightness(1.08)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
@media (max-width:860px){
  aside{display:none}
  main{padding:18px 14px 60px}
  header{gap:8px}
  .brand{font-size:14px}
}
</style>
</head>
<body>
<header>
  <div class="brand">📚 Codex 세션 기록</div>
  <div class="stats" id="stats"></div>
  <input id="search" type="search" placeholder="세션 검색 (제목 · 내용)…" autocomplete="off">
  <button id="open">📂 폴더 열기</button>
  <button id="theme" title="다크 모드 전환">🌙</button>
</header>
<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<script>
(function(){
"use strict";
var flat = [];
var projects = [];
var imgMap = new Map();
var cur = -1;
var overview = null;
var isOverview = false;
var stripHint = "";

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function inline(text){
  var s = esc(text), tokens = [];
  function grab(re, fn){
    s = s.replace(re, function(){
      var a = Array.prototype.slice.call(arguments,1,-2);
      tokens.push(fn.apply(null,a));
      return "\u0001"+(tokens.length-1)+"\u0001";
    });
  }
  grab(/`([^`\n]+)`/g, function(c){return "<code>"+c+"</code>";});
  grab(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function(alt,src){return "<img src=\""+src+"\" alt=\""+alt+"\" loading=\"lazy\">";});
  grab(/\[([^\]]*)\]\(([^)\s]+)\)/g, function(t,u){return "<a href=\""+u+"\">"+t+"</a>";});
  grab(/\*\*([^*]+)\*\*/g, function(t){return "<strong>"+t+"</strong>";});
  grab(/__([^_]+)__/g, function(t){return "<strong>"+t+"</strong>";});
  grab(/\*([^*]+)\*/g, function(t){return "<em>"+t+"</em>";});
  grab(/_([^_]+)_/g, function(t){return "<em>"+t+"</em>";});
  grab(/~~([^~]+)~~/g, function(t){return "<s>"+t+"</s>";});
  return s.replace(/\u0001(\d+)\u0001/g, function(m,i){return tokens[+i];});
}

function isBlockStart(i, lines){
  var l = lines[i].trim();
  if(!l) return false;
  if(/^(#{1,6})\s/.test(l)) return true;
  if(/^(`{3,}|~{3,})/.test(l)) return true;
  if(/^(\s*)([-*+]|\d+\.)\s+/.test(l)) return true;
  if(l.charAt(0)===">") return true;
  if(l.indexOf("<details")===0||l.indexOf("<summary")===0||l==="</details>") return true;
  if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) return true;
  if(l.indexOf("|")>=0&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1].trim())&&lines[i+1].indexOf("-")>=0) return true;
  return false;
}

function renderTable(rows){
  function cells(r){
    return r.trim().replace(/^\|/,"").replace(/\|$/,"").split(/(?<!\\)\|/).map(function(c){return c.trim().replace(/\\\|/g,"|");});
  }
  var h="<table><thead><tr>";
  cells(rows[0]).forEach(function(c){h+="<th>"+inline(c)+"</th>";});
  h+="</tr></thead><tbody>";
  for(var i=1;i<rows.length;i++){
    h+="<tr>";
    cells(rows[i]).forEach(function(c){h+="<td>"+inline(c)+"</td>";});
    h+="</tr>";
  }
  return h+"</tbody></table>";
}

function renderList(nodes){
  var html="", tag=null;
  function close(){if(tag){html+="</"+tag+">";tag=null;}}
  for(var k=0;k<nodes.length;k++){
    var it=nodes[k];
    if(tag!==it.type){close();tag=it.type;html+="<"+it.type+">";}
    html+="<li>"+inline(it.text);
    if(it.children.length){close();html+=renderList(it.children);}
    html+="</li>";
  }
  close();
  return html;
}

function renderMarkdown(md){
  var lines=String(md||"").replace(/\r\n?/g,"\n").split("\n");
  var out=[], para=[], i=0;
  function flush(){
    if(para.length){out.push("<p>"+para.join(" ")+"</p>");para=[];}
  }
  while(i<lines.length){
    var t=lines[i].trim();
    if(!t){flush();i++;continue;}
    var fm=t.match(/^(`{3,}|~{3,})(.*)$/);
    if(fm){
      flush();
      var fence=fm[1], lang=fm[2].trim(), code=[];
      i++;
      while(i<lines.length){
        if(lines[i].trim()===fence) break;
        code.push(lines[i]);i++;
      }
      i++;
      out.push("<pre><code"+(lang?' class="lang-'+esc(lang)+'"':"")+">"+esc(code.join("\n"))+"</code></pre>");
      continue;
    }
    if(t.indexOf("<details")===0||t.indexOf("<summary")===0||t==="</details>"){
      flush();out.push(lines[i]);i++;continue;
    }
    var hm=t.match(/^(#{1,6})\s+(.*)$/);
    if(hm){
      flush();
      var h=hm[1].length;
      out.push("<h"+h+">"+inline(hm[2])+"</h"+h+">");
      i++;continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(t)){
      flush();out.push("<hr>");i++;continue;
    }
    if(t.indexOf("|")>=0&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1].trim())&&lines[i+1].indexOf("-")>=0){
      flush();
      var rows=[t];i+=2;
      while(i<lines.length&&lines[i].trim().indexOf("|")>=0){rows.push(lines[i]);i++;}
      out.push(renderTable(rows));
      continue;
    }
    if(t.charAt(0)===">"){
      flush();
      var q=[];
      while(i<lines.length){
        var l=lines[i].trim();
        if(l.charAt(0)===">"){q.push(l.replace(/^>\s?/,""));i++;}
        else if(l===""&&i+1<lines.length&&lines[i+1].trim().charAt(0)===">"){q.push("");i++;}
        else break;
      }
      out.push("<blockquote>"+q.map(inline).join("<br>")+"</blockquote>");
      continue;
    }
    var lm=t.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if(lm){
      flush();
      var root={type:"ul",children:[]},stack=[root],indBase=lm[1].length;
      while(i<lines.length){
        var m=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if(!m) break;
        var lvl=Math.floor((m[1].length-indBase)/2);
        if(lvl<0) break;
        var item={type:(m[2]==="-"||m[2]==="*")?"ul":"ol",text:m[3],children:[]};
        while(stack.length-1>lvl) stack.pop();
        stack[stack.length-1].children.push(item);
        stack.push(item);
        i++;
        while(i<lines.length&&lines[i].trim()&&!isBlockStart(i,lines)){item.text+=" "+lines[i].trim();i++;}
      }
      out.push(renderList(root.children));
      continue;
    }
    para.push(inline(t));
    i++;
    while(i<lines.length&&lines[i].trim()&&!isBlockStart(i,lines)){para.push(inline(lines[i].trim()));i++;}
  }
  flush();
  return out.join("\n");
}

function titleOf(md){
  var m=String(md||"").match(/^#\s+(.+)$/m);
  return m?m[1].trim():"";
}

function dateOf(entry){
  var m=String(entry.name).match(/^(\d{4}-\d{2}-\d{2})_(\d{2})(\d{2})(\d{2})/);
  if(m) return m[1]+" "+m[2]+":"+m[3];
  var r=String(entry.text||"").match(/^\|\s*시작\s*\|\s*([^|]+?)\s*\|/m);
  return r?r[1].trim():"";
}

function metaChips(md){
  var rows={}, re=/^\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|/gm, m;
  while((m=re.exec(md||""))) rows[m[1].trim()]=m[2].trim().replace(/`/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1");
  var order=["시작","프로젝트","Git","모델","출처","CLI 버전","세션 ID"], chips=[];
  order.forEach(function(k){
    if(rows[k]&&rows[k]!=="-"&&rows[k]!==undefined) chips.push([k,rows[k]]);
  });
  return chips.map(function(c){
    return "<span class=\"chip\" title=\""+esc(c[1])+"\"><b>"+esc(c[0])+":</b> "+esc(c[1])+"</span>";
  }).join("");
}

function normalizeEntries(entries){
  stripHint="";
  if(!entries.length) return entries;
  var parts=entries.map(function(e){return e.relPath.split("/").filter(Boolean);});
  var strip=parts[0].length;
  for(var i=1;i<parts.length;i++){
    var a=parts[0], b=parts[i], n=Math.min(a.length,b.length), c=0;
    while(c<n&&a[c]===b[c]) c++;
    if(c<strip) strip=c;
  }
  stripHint=parts[0].slice(0,strip).join("/");
  return entries.map(function(en){
    var p=en.relPath.split("/").filter(Boolean).slice(strip);
    if(p.length&&p[0].toLowerCase()==="projects") p=p.slice(1);
    if(!p.length) p=[en.name];
    return {name:en.name, relPath:p.join("/"), text:en.text, blob:en.blob, handle:en.handle};
  });
}

function ensureBlob(img){
  if(img.blob) return Promise.resolve(img.blob);
  return img.handle.getFile().then(function(f){img.blob=f;return f;});
}

function loadEntryList(entries){
  cur=-1;
  isOverview=false;
  var norm=normalizeEntries(entries);
  overview=null;
  for(var i=norm.length-1;i>=0;i--){
    if(norm[i].relPath.toLowerCase()==="readme.md"){overview=norm[i].text||null;norm.splice(i,1);}
  }
  var mds=norm.filter(function(e){return /\.md$/i.test(e.name)&&e.name.toLowerCase()!=="readme.md";});
  var imgs=norm.filter(function(e){return /\.(png|jpe?g|gif|webp)$/i.test(e.name);});
  imgMap=new Map();
  imgs.forEach(function(im){imgMap.set("/"+im.relPath.toLowerCase(),im);});
  return Promise.all(mds.map(function(md){
    if(md.text!=null) return md;
    if(md.blob) return md.blob.text().then(function(t){md.text=t;return md;});
    if(md.handle) return md.handle.getFile().then(function(f){return f.text();}).then(function(t){md.text=t;return md;});
    return md;
  })).then(function(){
    var byProj={};
    mds.forEach(function(md){
      var parts=md.relPath.split("/");
      var proj=(parts.length>1?parts[0]:(stripHint?stripHint.split("/").pop():"_기타"));
      (byProj[proj]=byProj[proj]||[]).push(md);
    });
    projects=[];
    Object.keys(byProj).sort().forEach(function(name){
      projects.push({name:name, sessions:byProj[name].sort(function(a,b){return b.name.localeCompare(a.name);})});
    });
    flat=[];
    projects.forEach(function(p,pi){
      p.sessions.forEach(function(s,si){flat.push({pi:pi,si:si,proj:p.name,entry:s});});
    });
    buildSidebar("");
    document.getElementById("stats").textContent=flat.length+"개 세션 · "+projects.length+"개 프로젝트";
    if(flat.length){fromHash();if(cur<0&&!isOverview)show(0);}
  });
}

function resolveImages(md, entry){
  var links=String(md||"").match(/!\[[^\]]*\]\(([^)]+)\)/g)||[];
  return links.reduce(function(p,link){
    return p.then(function(text){
      var url=link.match(/\(([^)]+)\)/)[1].trim();
      if(/^(data:|https?:|file:)/.test(url)) return text;
      var dir=entry.relPath.replace(/\/[^/]+$/,"");
      var key="/"+(dir+"/"+url).replace(/\\/g,"/").replace(/^\/+/,"").toLowerCase();
      var img=imgMap.get(key);
      if(!img) return text;
      return ensureBlob(img).then(function(blob){
        var obj=URL.createObjectURL(blob);
        return text.split(link).join("!["+img.name+"]("+obj+")");
      });
    });
  },Promise.resolve(md));
}

function show(idx){
  if(idx<0||idx>=flat.length) return;
  cur=idx;
  isOverview=false;
  var s=flat[idx], entry=s.entry;
  var m=document.getElementById("main");
  var prev=idx>0?flat[idx-1]:null, next=idx<flat.length-1?flat[idx+1]:null;
  var title=titleOf(entry.text)||entry.name.replace(/\.md$/i,"");
  var short=function(t){return t.length>24?t.slice(0,24)+"…":t;};
  m.innerHTML="<div class=\"wrap\">"
    +"<div class=\"crumb\"><b>"+esc(s.proj)+"</b> › 세션</div>"
    +"<h1 class=\"title\">"+inline(title)+"</h1>"
    +"<div class=\"chips\">"+metaChips(entry.text)+"</div>"
    +"<article id=\"article\">…읽는 중…</article>"
    +"<div class=\"pager\">"
    +"<button id=\"prevB\" "+(prev?"":"disabled")+">← 이전"+(prev?" · "+esc(short(titleOf(prev.entry.text)||prev.entry.name)):"")+"</button>"
    +"<button id=\"nextB\" "+(next?"":"disabled")+">"+(next?"다음 · "+esc(short(titleOf(next.entry.text)||next.entry.name)):"다음")+" →</button>"
    +"</div></div>";
  m.scrollTop=0;
  resolveImages(entry.text, entry).then(function(md){
    document.getElementById("article").innerHTML=renderMarkdown(md);
  });
  document.getElementById("prevB").onclick=function(){show(cur-1);};
  document.getElementById("nextB").onclick=function(){show(cur+1);};
  markActive();
  location.hash="#p"+cur;
}

function showOverview(){
  cur=-1;
  isOverview=true;
  var m=document.getElementById("main");
  var body=overview
    ? renderMarkdown(overview)
    : "<div class=\"empty\"><p><b>개요(README.md)가 없습니다.</b></p><p>폴더 열기에서 <code>projects</code> 폴더를 선택하면 <code>README.md</code>가 개요로 표시됩니다.</p></div>";
  m.innerHTML="<div class=\"wrap\">"
    +"<div class=\"crumb\"><b>개요</b> › 프로젝트 개요</div>"
    +"<h1 class=\"title\">📋 프로젝트 개요</h1>"
    +"<article>"+body+"</article>"
    +"</div>";
  m.scrollTop=0;
  location.hash="#overview";
  markActive();
}

function markActive(){
  var items=document.querySelectorAll(".sess");
  for(var i=0;i<items.length;i++) items[i].classList.toggle("active",+items[i].dataset.idx===cur);
  var ov=document.getElementById("ovLink");
  if(ov) ov.classList.toggle("active",isOverview);
}

function buildSidebar(query){
  var sb=document.getElementById("sidebar");
  var q=(query||"").trim().toLowerCase();
  var total=0, html="";
  html+="<a class=\"ov\" id=\"ovLink\" href=\"#overview\"><span>📋</span> 프로젝트 개요</a>";
  projects.forEach(function(p,pi){
    var list=p.sessions.map(function(s,si){
      var idx=-1;
      for(var k=0;k<flat.length;k++){if(flat[k].pi===pi&&flat[k].si===si){idx=k;break;}}
      return {idx:idx,title:titleOf(s.text)||s.name,date:dateOf(s),hay:(s.name+" "+(titleOf(s.text)||"")+" "+(s.text||"")).toLowerCase()};
    }).filter(function(s){return !q||s.hay.indexOf(q)>=0;});
    if(!list.length) return;
    total+=list.length;
    html+="<div class=\"proj open\"><div class=\"proj-head\"><span class=\"chev\">▶</span>"+esc(p.name)+"<span class=\"cnt\">"+list.length+"</span></div>";
    list.forEach(function(s){
      html+="<a class=\"sess\" data-idx=\""+s.idx+"\" href=\"#p"+s.idx+"\">"
        +"<span class=\"d\">"+esc(s.date)+"</span><span class=\"t\">"+esc(s.title.length>70?s.title.slice(0,70)+"…":s.title)+"</span></a>";
    });
    html+="</div>";
  });
  sb.innerHTML=html||"<div class=\"empty\">검색 결과가 없습니다</div>";
  var ov=document.getElementById("ovLink");
  if(ov){
    ov.addEventListener("click",function(e){
      e.preventDefault();
      showOverview();
    });
  }
  var items=sb.querySelectorAll(".sess");
  for(var i=0;i<items.length;i++){
    items[i].addEventListener("click",function(e){
      e.preventDefault();
      show(+this.dataset.idx);
    });
  }
  var heads=sb.querySelectorAll(".proj-head");
  for(var j=0;j<heads.length;j++){
    heads[j].addEventListener("click",function(){this.parentElement.classList.toggle("open");});
  }
  markActive();
}

function applyTheme(dark){
  document.body.classList.toggle("dark",dark);
  document.getElementById("theme").textContent=dark?"☀️":"🌙";
  try{localStorage.setItem("codex-viewer-dark",dark?"1":"0");}catch(e){}
}

function fromHash(){
  var h=(location.hash||"");
  if(h==="#overview"){showOverview();return;}
  var m=h.match(/^#p(\d+)$/);
  if(!m) return;
  var idx=+m[1];
  if(idx>=0&&idx<flat.length) show(idx);
}

document.getElementById("open").onclick=function(){openFolder();};
document.getElementById("theme").onclick=function(){
  applyTheme(!document.body.classList.contains("dark"));
};
try{applyTheme(localStorage.getItem("codex-viewer-dark")==="1");}catch(e){}

var search=document.getElementById("search");
search.addEventListener("input",function(){buildSidebar(search.value);});
document.addEventListener("keydown",function(e){
  if(e.target===search) return;
  if(e.key==="ArrowLeft"){show(cur-1);}
  else if(e.key==="ArrowRight"){show(cur+1);}
  else if(e.key==="/"){search.focus();e.preventDefault();}
});
window.addEventListener("hashchange",fromHash);

function landing(){
  document.getElementById("stats").textContent="";
  document.getElementById("sidebar").innerHTML="";
  document.getElementById("main").innerHTML=
    "<div class=\"landing\">"
    +"<h2>📂 프로젝트 폴더를 열어주세요</h2>"
    +"<p>뷰어는 <code>projects</code> 폴더 아래의 md 파일을 직접 읽어 표시합니다.<br>"
    +"<code>projects/README.md</code>는 '개요' 메뉴로 보여집니다.</p>"
    +"<button class=\"btn\" onclick=\"document.getElementById('open').click()\">📂 폴더 열기</button>"
    +"</div>";
}
landing();

var pickerInput=document.createElement("input");
pickerInput.type="file";
pickerInput.style.display="none";
pickerInput.multiple=true;
document.body.appendChild(pickerInput);
if("webkitdirectory" in pickerInput) pickerInput.setAttribute("webkitdirectory","");
pickerInput.setAttribute("directory","");
pickerInput.addEventListener("change",function(){
  var files=Array.prototype.slice.call(pickerInput.files||[]);
  pickerInput.value="";
  if(!files.length) return;
  loadEntryList(files.map(function(f){
    return {name:f.name, relPath:f.webkitRelativePath||f.name, text:null, blob:f};
  })).catch(function(e){console.error(e);});
});

function openFolder(){
  if(window.showDirectoryPicker){
    window.showDirectoryPicker({mode:"read"}).then(function(root){
      var base=root;
      if(root.name!=="projects"){
        var it=root.values(), seek=function(){
          return it.next().then(function(res){
            if(res.done) return null;
            if(res.value.kind==="directory"&&res.value.name==="projects") return res.value;
            return seek();
          });
        };
        return seek().then(function(proj){return proj||root;});
      }
      return root;
    }).then(function(base){
      var out=[];
      var walk=function(dir,prefix){
        var it=dir.values(), go=function(){
          return it.next().then(function(res){
            if(res.done) return;
            var en=res.value, rp=prefix?prefix+"/"+en.name:en.name;
            if(en.kind==="directory") return walk(en,rp).then(go);
            var item={name:en.name, relPath:rp, text:null, blob:null, handle:en};
            if(/\.md$/i.test(en.name)){
              return en.getFile().then(function(f){return f.text();}).then(function(txt){
                item.text=txt; out.push(item);
              }).then(go);
            }
            out.push(item);
            return go();
          });
        };
        return go();
      };
      return walk(base,"").then(function(){
        return loadEntryList(out);
      });
    }).catch(function(e){
      if(e&&e.name==="AbortError") return;
      console.error(e);
    });
  } else {
    pickerInput.click();
  }
}
})();
</script>
